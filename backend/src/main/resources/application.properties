# backend/src/main/resources/application.properties
# ─────────────────────────────────────────────────────
# FEIRS — Fingerprint-based Emergency Identity Retrieval System
# backend/src/main/resources/application.properties
# ─────────────────────────────────────────────────────
# FEIRS — Fingerprint-based Emergency Identity Retrieval System
# Architecture: React → MFS100ClientService (port 8004) for capture
#               React → Spring Boot (port 8080) for enroll / identify
# ─────────────────────────────────────────────────────

spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# ── Database (Cloud Ready via Environment Variables) ──
spring.datasource.url=${SUPABASE_URL_JDBC:jdbc:postgresql://db.tnxaefuxgxtuadxxvjhw.supabase.co:6543/postgres?pgbouncer=true}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# ── JPA ────────────────────────────────────────────────
# create = Hibernate drops and recreates tables on startup (clean-slate for enterprise rebuild)
# SWITCH to 'update' or 'validate' once the 7-table schema stabilizes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── SQL Init ───────────────────────────────────────────
# Runs schema.sql before Hibernate DDL to drop legacy PoC tables
spring.sql.init.mode=never

# ── Security (disable login page for REST API) ─────────
spring.security.user.name=admin
spring.security.user.password=admin123

# ── BMP save path (where captured fingerprint images are stored) ──
fingerprint.save.path=C:/Users/prash/Documents/Files/Visual Studio Code/Programs/React JS Programs/Fingerprint-based Emergency Identity Retrieval System/captured_fingerprints/

# ── Server ─────────────────────────────────────────────
server.port=8080

# ── Supabase API (For Storage) ─────────────────────────
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

# ── Email Settings ─────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── File Upload Limits ─────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── JWT Secret ─────────────────────────────────────────
feirs.app.jwtSecret=${JWT_SECRET}
